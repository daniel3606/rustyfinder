name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The pane and window tests wait up to 5 s for file-system events;
      # a few threads keep them reliable on shared runners.
      - run: cargo test --workspace -- --test-threads=4

  app:
    name: App build
    runs-on: macos-26
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: scripts/build.sh
      # Zipped with ditto so the bundle's symlinks and attributes survive.
      - run: ditto -c -k --keepParent build/RustyFinder.app build/RustyFinder.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RustyFinder
          path: build/RustyFinder.zip
          retention-days: 7
