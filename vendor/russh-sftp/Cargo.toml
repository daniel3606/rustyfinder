# Vendored copy of russh-sftp 3.0.1 (Apache-2.0, see LICENSE), patched for
# RustyFinder. See VENDORED.md for what changed and why.

[package]
edition = "2021"
name = "russh-sftp"
version = "3.0.1"
description = "SFTP subsystem supported server and client for Russh"
license = "Apache-2.0"
repository = "https://github.com/AspectUnk/russh-sftp"
publish = false

[features]
async-trait = ["dep:async-trait"]

[lib]
name = "russh_sftp"
path = "src/lib.rs"

[dependencies.async-trait]
version = "0.1.92"
optional = true

[dependencies.bitflags]
version = "2.13.1"
features = ["serde"]

[dependencies.bytes]
version = "1.12.1"

[dependencies.chrono]
version = "0.4.45"

[dependencies.dashmap]
version = "6.2.1"

[dependencies.log]
version = "0.4.34"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_bytes]
version = "0.11.19"

[dependencies.thiserror]
version = "2.0.20"

[dependencies.tokio]
version = "1"
features = [
    "io-util",
    "rt",
    "sync",
    "time",
    "macros",
]
default-features = false

[dependencies.tokio-util]
version = "0.7.19"
features = ["rt"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.gloo-timers]
version = "0.4.0"
features = ["futures"]

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4.78"
