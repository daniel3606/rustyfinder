name: RustyFinder
options:
  bundleIdPrefix: dev.rustyfinder
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  RustyFinder:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Generated
      - path: Resources
        optional: true
      # Help (⌘?) shows the README from inside the app.
      - path: ../README.md
        buildPhase: resources
    dependencies:
      - framework: ../build/RustyFinderFFI.xcframework
        embed: false
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: RustyFinder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Personal use.
        NSAppleEventsUsageDescription: RustyFinder asks Finder to empty the Trash when you choose Empty Trash.
        NSLocalNetworkUsageDescription: RustyFinder looks for file servers on your network to list them under Shares.
        NSBonjourServices:
          - _smb._tcp
          - _afpovertcp._tcp
        CFBundleURLTypes:
          - CFBundleURLName: dev.rustyfinder.link
            CFBundleURLSchemes:
              - rustyfinder
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
        NSServices:
          - NSMenuItem:
              default: Reveal in RustyFinder
            NSMessage: revealInRustyFinder
            NSPortName: RustyFinder
            NSRequiredContext: {}
            NSSendTypes:
              - public.file-url
              - public.utf8-plain-text
              - NSFilenamesPboardType
              - NSStringPboardType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rustyfinder.RustyFinder
        PRODUCT_NAME: RustyFinder
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
        # The RAR decoder in the Rust library is C++.
        OTHER_LDFLAGS: "-lc++"
        # Same for Swift: #file strings and debug info name /rustyfinder/..., not this Mac.
        OTHER_SWIFT_FLAGS: "-file-prefix-map $(SRCROOT)/..=/rustyfinder -file-prefix-map $(HOME)=/home"
